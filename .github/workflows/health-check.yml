name: Health check

# Runs after the daily forecast should have finished. When the forecast was not
# published today, station data is more than two days old, the quality gate
# failed or the model has fallen behind persistence, it opens (or updates) a
# GitHub issue labelled pipeline-health, which emails the repository owner.
# The issue is closed automatically on the next healthy run.
on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * *" # 10:37 in Bangkok

permissions:
  contents: read
  issues: write

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PM25_DATA_DIR: state/data
      PM25_MODELS_DIR: state/models
      GH_TOKEN: ${{ github.token }}
      LABEL: pipeline-health
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: pip install -e .

      - name: Restore data
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin data; then
            git fetch --depth 1 origin data
            git worktree add --detach state FETCH_HEAD
          fi

      - name: Check health
        id: health
        continue-on-error: true
        run: python -m pm25 health --output health.md

      - name: Open or update the alert issue
        if: ${{ steps.health.outcome == 'failure' }}
        run: |
          cat health.md >> "$GITHUB_STEP_SUMMARY"
          gh label create "$LABEL" --color B60205 --description "Automatic pipeline alert" --force
          number=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file health.md
          else
            gh issue create --title "Pipeline health alert" --label "$LABEL" --body-file health.md
          fi
          exit 1

      - name: Close a resolved alert
        if: ${{ steps.health.outcome == 'success' }}
        run: |
          cat health.md >> "$GITHUB_STEP_SUMMARY"
          for number in $(gh issue list --label "$LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Resolved: $(cat health.md)"
          done
