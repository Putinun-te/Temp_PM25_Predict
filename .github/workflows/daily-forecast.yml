name: Daily forecast

on:
  workflow_dispatch:
  # Keep disabled until the first manual run has been reviewed.
  # 19:30 UTC is 02:30 in Bangkok, after the previous local day is complete.
  # schedule:
  #   - cron: "30 19 * * *"

permissions:
  contents: write # Needed only to update the data branch

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PM25_DATA_DIR: state/data
      PM25_MODELS_DIR: state/models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Restore data and models
        run: |
          if git ls-remote --exit-code --heads origin data; then
            git fetch --depth 1 origin data
            git worktree add --detach state FETCH_HEAD
          else
            mkdir -p state
          fi

      - name: Backfill
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: python -m pm25 backfill

      - name: Train and evaluate
        run: python -m pm25 train

      - name: Predict
        run: python -m pm25 predict

      - name: Publish to Firebase
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python -m pm25 publish

      # The data branch keeps a single commit, so daily updates cannot grow the repository.
      - name: Save data and models
        if: ${{ !cancelled() }}
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          cd state
          rm -rf .git
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data models
          git commit -q -m "Update data and models"
          git push --force "$REMOTE" data

      - name: Upload model and metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: model-and-metrics
          retention-days: 7
          if-no-files-found: warn
          path: |
            state/models/metrics.json
            state/models/registry.json
            state/models/forecast.json
            state/models/walk_forward.png
            state/models/*.joblib
