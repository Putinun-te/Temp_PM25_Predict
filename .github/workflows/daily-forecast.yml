name: Daily forecast

on:
  workflow_dispatch:
  schedule:
    # 00:17 UTC is 07:17 in Bangkok. An off-minute avoids the busiest start
    # times; GitHub may still start scheduled runs some minutes late.
    - cron: "17 0 * * *"

permissions:
  contents: write # Needed only to update the data branch
  id-token: write # Federated login to Azure, used only when Azure is configured

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PM25_DATA_DIR: state/data
      PM25_MODELS_DIR: state/models
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest

      - name: Restore data and models
        run: |
          if git ls-remote --exit-code --heads origin data; then
            git fetch --depth 1 origin data
            git worktree add --detach state FETCH_HEAD
          else
            mkdir -p state
          fi

      - name: Backfill
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }} # Optional: fire features are skipped without it
        run: python -m pm25 backfill

      - name: Check data quality and build silver
        run: python -m pm25 check

      - name: Train and evaluate
        run: python -m pm25 train

      - name: Predict
        env:
          TMD_API_TOKEN: ${{ secrets.TMD_API_TOKEN }}
        run: python -m pm25 predict

      - name: Write daily report
        run: |
          python -m pm25 report
          cat state/models/report.md >> "$GITHUB_STEP_SUMMARY"
          echo "REPORT_DATE=$(python -c "import json; print(json.load(open('state/models/forecast.json'))['as_of'])")" >> "$GITHUB_ENV"

      - name: Score published forecasts
        run: python -m pm25 monitor

      - name: Sign in to Azure
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        continue-on-error: true # Azure is optional; it must never block the forecast
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The SQL firewall opens for this runner's address only, and closes again below.
      - name: Load the layers into Azure SQL
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        continue-on-error: true # Azure is optional; it must never block the forecast
        env:
          AZURE_SQL_SERVER: ${{ vars.AZURE_SQL_SERVER }}
        run: |
          ip=$(curl -s https://api.ipify.org)
          az sql server firewall-rule create -g "${{ vars.AZURE_RESOURCE_GROUP }}" -s "$AZURE_SQL_SERVER" \
            -n "gha-${{ github.run_id }}" --start-ip-address "$ip" --end-ip-address "$ip" -o none
          python -m pm25 load-sql

      - name: Close the SQL firewall
        if: ${{ always() && vars.AZURE_CLIENT_ID != '' }}
        run: |
          az sql server firewall-rule delete -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -s "${{ vars.AZURE_SQL_SERVER }}" -n "gha-${{ github.run_id }}" -o none || true

      - name: Publish to Firebase
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python -m pm25 publish

      # The data branch keeps a single commit, so daily updates cannot grow its history.
      # Daily reports accumulate in its reports/ folder.
      - name: Save data, models and reports
        if: ${{ !cancelled() }}
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          mkdir -p state/data state/models state/reports
          cd state
          rm -rf .git
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data models reports
          git commit -q -m "Update data, models and reports"
          git push --force "$REMOTE" data

      - name: Upload daily report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: daily-report-${{ env.REPORT_DATE || github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            state/models/report.md
            state/models/report.csv
            state/models/report.pdf
            state/models/forecast.json
            state/models/walk_forward.png

      - name: Upload model and metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: model-and-metrics
          retention-days: 7
          if-no-files-found: warn
          path: |
            state/models/metrics.json
            state/models/registry.json
            state/models/*.joblib
