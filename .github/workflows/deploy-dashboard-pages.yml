name: Deploy dashboard to GitHub Pages

# Fallback host for after Azure for Students ends. It builds the same Next.js
# static export, served under /<repository>. Enable GitHub Pages with
# "GitHub Actions" as the source, then run this workflow by hand or add a push trigger.
on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: deploy-dashboard-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/configure-pages@v6

      - name: Install, test and build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

      - id: deployment
        uses: actions/deploy-pages@v5
