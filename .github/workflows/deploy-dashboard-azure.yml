name: Deploy dashboard to Azure

# Main site: App Service free plan (F1). Backup site: Blob Storage static website.
# Runs only while the Azure for Students setup exists (repository variables are set).
# When Azure is removed, delete the variables and use deploy-dashboard-pages.yml instead.
on:
  push:
    branches: [main]
    paths: ["dashboard/**"]
  workflow_dispatch:

permissions:
  id-token: write # Federated login to Azure, no stored password
  contents: read

concurrency:
  group: deploy-dashboard-azure
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        run: |
          cd dashboard && zip -q -r ../dashboard.zip . && cd ..
          az webapp deploy -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_WEBAPP_NAME }}" \
            --src-path dashboard.zip --type zip

      - name: Upload to the Blob Storage backup site
        run: |
          az storage blob upload-batch --auth-mode login --overwrite \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" -d '$web' -s dashboard
