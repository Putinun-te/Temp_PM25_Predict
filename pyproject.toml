[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pm25"
version = "0.1.0"
description = "PM2.5 and PM10 forecasting pipeline for Bangkok built on public data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-auth==2.62.1",
    "joblib==1.6.0",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
